<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Serendip</title>
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Serendip">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#1C1C1C">
<link rel="apple-touch-icon" href="/app/icon-180.png">
<link rel="icon" type="image/png" href="/app/favicon.png">
<link rel="manifest" href="/app/manifest.webmanifest">
<style>
  :root{--gold:#E3A92B;--ink:#1C1C1C;--ivory:#F7F4EE}
  *{box-sizing:border-box;margin:0}
  body{min-height:100vh;min-height:100dvh;background:var(--ink);color:var(--ivory);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;padding:24px 16px}
  .box{max-width:360px;width:100%;text-align:center}
  img{width:132px;height:132px;border-radius:30px;box-shadow:0 0 0 1px #333}
  h1{font-size:26px;letter-spacing:4px;margin:22px 0 4px;color:var(--gold)}
  p{opacity:.8;font-size:15px;line-height:1.5}
  a.btn{display:block;margin:26px 0 18px;padding:16px;border-radius:14px;background:var(--gold);color:var(--ink);font-weight:700;font-size:17px;text-decoration:none}
  .tip{font-size:13px;opacity:.65}
  .stripe{height:8px;margin-top:28px;border-radius:4px;background:repeating-linear-gradient(135deg,var(--gold) 0 10px,var(--ink) 10px 20px)}
</style>
</head>
<body>
<div class="box">
  <img src="/app/icon-512.png" alt="UK Design &amp; Build">
  <h1>SERENDIP</h1>
  <p>App nội bộ UK Design &amp; Build</p>
  <a class="btn" id="go" href="https://script.google.com/a/macros/ukdesign-build.com/s/AKfycbx8_t_zGSyG4YifdlXRR_wQcp65jfw8OPhS6ZjV63Ie_ZdRv6UxJDZtqv80j5GZrSKRow/exec">Mở Serendip</a>
  <p class="tip">iPhone: bấm nút Chia sẻ (ô vuông có mũi tên) &gt; "Thêm vào MH chính" để có icon UK trên màn hình.</p>
  <div class="stripe"></div>
</div>
<script>
  // Opened from the home-screen icon: go straight into the app.
  var standalone = window.navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  if (standalone || /[?&]launch=1/.test(location.search)) location.replace(document.getElementById('go').href);
</script>
</body>
</html>
